<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4ecd8">
  <meta name="robots" content="noindex">
  <title>One Monster After Another</title>
  <meta name="description" content="A letter passed from monster to monster: a game after Mercer Mayer's picture book. Coming soon.">
  <style>
    :root { color-scheme: light; --paper: #f4ecd8; --ink: #3b2a1e; --soft: #7a6450; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--paper); color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      display: grid; place-items: center; text-align: center; padding: 0 16px;
    }
    main { visibility: hidden; }
    body.in main { visibility: visible; }
    h1 { font-size: clamp(2rem, 7vw, 4rem); line-height: 1.1; margin: 0 0 0.6em; }
    p { font-size: clamp(1rem, 3vw, 1.4rem); color: var(--soft); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>One Monster After Another</h1>
    <p>Coming soon.</p>
  </main>
  <script type="module">
    import { openGate } from './src/gate/gate.js';
    openGate({
      title: 'One Monster After Another',
      game: 'onemonster',
      blurb: 'This game is for friends of Hoai Nguyen. Use your invite link, or enter your code below.',
    }).then(() => { document.body.classList.add('in'); });
  </script>
</body>
</html>
