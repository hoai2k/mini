omp on landing · ground: tap to hop back, hold to charge a super leap</text><text x="1005" y="290" font-size="20" font-weight="bold">B · GUARD</text><text x="1005" y="312" font-size="15">Hold: shield the front · air: brake</text><text x="1005" y="356" font-size="20" font-weight="bold">A · JUMP</text><text x="1005" y="378" font-size="15">Hold to soar, keep holding to glide · wall kick</text><text x="1005" y="422" font-size="20" font-weight="bold">X · SPIN KICK · PARRY</text><text x="1005" y="444" font-size="15">All-round sweep, ground or air</text><text x="1005" y="488" font-size="20" font-weight="bold">RIGHT STICK</text><text x="1005" y="510" font-size="15">Turn the view up to 45° · click: Horizon View</text><text x="720" y="558" text-anchor="middle" font-size="18">Menus: A confirm · B back  |  Automatic: ledge mantle · stomp bounce off flyers · takeoff strike behind · landing guide while airborne</text></g></svg>