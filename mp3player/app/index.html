<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MP3 Player</title>
<meta name="description" content="Play the music on your phone, tablet or computer, laid out like a streaming app.">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MP3 Player">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <a class="brand" href="../" title="Back to mini">
      <img class="brand-logo" id="brandLogo" alt="MP3 Player" hidden>
      <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
      <span class="brand-text" id="brandText">MP3 Player</span>
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="addBtn" type="button" aria-label="Add music" title="Add music"></button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings"></button>
    </div>
  </header>
  <main class="view" id="view" tabindex="-1"></main>
</div>

<div class="mini" id="mini" hidden>
  <div class="mini-progress"><div class="mini-fill" id="miniFill"></div></div>
  <button class="mini-open" id="miniOpen" type="button" aria-label="Open the player">
    <span class="art" id="miniArt"></span>
    <span class="meta"><span class="t" id="miniTitle"></span><span class="s" id="miniArtist"></span></span>
  </button>
  <button class="icon-btn" id="miniPrev" type="button" aria-label="Previous"></button>
  <button class="icon-btn mini-play" id="miniPlay" type="button" aria-label="Play"></button>
  <button class="icon-btn" id="miniNext" type="button" aria-label="Next"></button>
</div>

<section class="now" id="now" hidden aria-label="Now playing" role="dialog" aria-modal="true">
  <div class="now-bg" id="nowBg"></div>
  <div class="now-inner">
    <header class="now-head">
      <button class="icon-btn" id="nowClose" type="button" aria-label="Close the player"></button>
      <div class="now-from">
        <span class="now-from-kind" id="nowFromKind">Playing from</span>
        <button class="now-from-name" id="nowFromName" type="button"></button>
      </div>
      <button class="icon-btn" id="nowMore" type="button" aria-label="More options"></button>
    </header>
    <div class="now-art-wrap" id="nowArtWrap">
      <div class="art now-art" id="nowArt"></div>
    </div>
    <div class="now-meta">
      <div class="now-titles">
        <h2 class="now-title" id="nowTitle"></h2>
        <button class="now-artist" id="nowArtist" type="button"></button>
      </div>
      <span class="sleep-badge" id="sleepBadge" hidden></span>
    </div>
    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position">
      <div class="times"><span id="tNow">0:00</span><span id="tLeft">0:00</span></div>
    </div>
    <div class="transport">
      <button class="icon-btn toggle" id="shuffleBtn" type="button" aria-label="Shuffle" aria-pressed="false"></button>
      <button class="icon-btn big" id="prevBtn" type="button" aria-label="Previous"></button>
      <button class="play-btn" id="playBtn" type="button" aria-label="Play"></button>
      <button class="icon-btn big" id="nextBtn" type="button" aria-label="Next"></button>
      <button class="icon-btn toggle" id="repeatBtn" type="button" aria-label="Repeat: off"></button>
    </div>
    <div class="now-foot">
      <label class="volume" id="volumeWrap">
        <span class="vol-icon" id="volIcon"></span>
        <input type="range" id="volume" min="0" max="100" value="100" aria-label="Volume">
      </label>
      <button class="icon-btn" id="queueBtn" type="button" aria-label="Queue" title="Queue"></button>
    </div>
  </div>
</section>

<section class="page queue-page" id="queuePage" hidden aria-label="Queue" role="dialog" aria-modal="true">
  <header class="page-head">
    <button class="icon-btn" id="queueClose" type="button" aria-label="Back to the player"></button>
    <h2>Queue</h2>
    <span class="spacer"></span>
  </header>
  <div class="page-body" id="queueBody"></div>
</section>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel" id="sheetPanel" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>

<div class="progress-card" id="importCard" hidden role="status" aria-live="polite">
  <div class="progress-text" id="importText"></div>
  <div class="progress-bar"><div class="progress-fill" id="importFill"></div></div>
  <button class="text-btn" id="importCancel" type="button">Stop</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastText"></span>
  <button class="text-btn" id="toastAction" type="button" hidden></button>
</div>

<div class="dropzone" id="dropzone" hidden><div>Drop music here to add it to your library</div></div>

<input type="file" id="pickFiles" multiple hidden
       accept="audio/*,.mp3,.m4a,.m4b,.aac,.mp4,.flac,.wav,.ogg,.oga,.opus,.webm,.aif,.aiff,.caf">
<input type="file" id="pickFolder" multiple webkitdirectory hidden>

<noscript><p class="noscript">MP3 Player needs JavaScript.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
