<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Micro prototypes</title>
  <meta name="description" content="Prototypes for a game about microscopic creatures: a springtail, a mite, a tardigrade, an amoeba, a Paramecium and a bacterium, each in a different microscope look.">
  <link rel="icon" href="../../favicon.ico">
  <style>
    :root { --bg: #0b0d10; --ink: #eef1f4; --dim: #9aa4ae; --card: #151a20; --line: #26303a; --accent: #9fd0ff; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 1.8rem; margin: 0 0 4px; letter-spacing: -0.01em; }
    .lede { color: var(--dim); margin: 0 0 24px; max-width: 64ch; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
    a.card { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      overflow: hidden; color: inherit; text-decoration: none; transition: transform .15s, border-color .15s; }
    a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
    .art { aspect-ratio: 3 / 2; background-size: cover; background-position: center; }
    .body { padding: 12px 14px 14px; }
    .body h2 { font-size: 1.05rem; margin: 0 0 2px; }
    .look { color: var(--accent); font-size: .8rem; margin: 0 0 6px; }
    .body p { margin: 0; color: var(--dim); font-size: .9rem; }
    footer { margin-top: 28px; color: var(--dim); font-size: .85rem; }
    footer a { color: var(--accent); }
    a.card.sel { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1 data-t="prototypes.heading"></h1>
    <p class="lede" data-t-html="prototypes.lede"></p>
    <div class="grid">
      <a class="card" href="springtail/" data-art="MP-U05" data-bg="linear-gradient(135deg,#6f8f6a,#1d2a1c)">
        <div class="art"></div>
        <div class="body"><h2 data-t="prototypes.cards.springtail.name"></h2><p class="look" data-t="prototypes.cards.springtail.look"></p>
          <p data-t="prototypes.cards.springtail.text"></p></div>
      </a>
      <a class="card" href="mite/" data-art="MP-U01" data-bg="linear-gradient(135deg,#6b6f73,#1c1e20)">
        <div class="art"></div>
        <div class="body"><h2 data-t="prototypes.cards.mite.name"></h2><p class="look" data-t="prototypes.cards.mite.look"></p>
          <p data-t="prototypes.cards.mite.text"></p></div>
      </a>
      <a class="card" href="tardigrade/" data-art="MP-U02" data-bg="linear-gradient(135deg,#a9b4a0,#3d4a3a)">
        <div class="art"></div>
        <div class="body"><h2 data-t="prototypes.cards.tardigrade.name"></h2><p class="look" data-t="prototypes.cards.tardigrade.look"></p>
          <p data-t="prototypes.cards.tardigrade.text"></p></div>
      </a>
      <a class="card" href="amoeba/" data-art="MP-U03" data-bg="linear-gradient(135deg,#efe6cf,#a99f84)">
        <div class="art"></div>
        <div class="body"><h2 data-t="prototypes.cards.amoeba.name"></h2><p class="look" data-t="prototypes.cards.amoeba.look"></p>
          <p data-t="prototypes.cards.amoeba.text"></p></div>
      </a>
      <a class="card" href="paramecium/" data-art="MP-U04" data-bg="linear-gradient(135deg,#1e2f4a,#05070b)">
        <div class="art"></div>
        <div class="body"><h2 data-t="prototypes.cards.paramecium.name"></h2><p class="look" data-t="prototypes.cards.paramecium.look"></p>
          <p data-t="prototypes.cards.paramecium.text"></p></div>
      </a>
      <a class="card" href="bacterium/" data-art="MP-U06" data-bg="linear-gradient(135deg,#2a2f3a,#08090c)">
        <div class="art"></div>
        <div class="body"><h2 data-t="prototypes.cards.bacterium.name"></h2><p class="look" data-t="prototypes.cards.bacterium.look"></p>
          <p data-t="prototypes.cards.bacterium.text"></p></div>
      </a>
      <a class="card" href="phage/" data-art="MP-U09" data-bg="linear-gradient(135deg,#2c6e6a,#e0a65a)">
        <div class="art"></div>
        <div class="body"><h2 data-t="prototypes.cards.phage.name"></h2><p class="look" data-t="prototypes.cards.phage.look"></p>
          <p data-t="prototypes.cards.phage.text"></p></div>
      </a>
      <a class="card" href="zoom/" data-art="MP-U08" data-bg="radial-gradient(circle at 50% 50%,#f4e9c8 0 18%,#6b6f73 19% 34%,#2f4a2c 35%,#08090c 100%)">
        <div class="art"></div>
        <div class="body"><h2 data-t="prototypes.cards.zoom.name"></h2><p class="look" data-t="prototypes.cards.zoom.look"></p>
          <p data-t="prototypes.cards.zoom.text"></p></div>
      </a>
    </div>
    <footer data-t-html="prototypes.footer"></footer>
  </main>
  <script type="module">
    import { boot } from './shared/boot.js';
    import { ASSETS } from './shared/asset-list.js';
    import { createPad, BTN } from './shared/pad.js';
    import { fillText } from './shared/text.js';
    fillText(); // the page's words: prototypes.* in shared/text_config.js
    boot(() => {
      const cards = [...document.querySelectorAll('a.card')];
      for (const c of cards) {
        const a = c.dataset.art ? ASSETS[c.dataset.art] : null;
        c.querySelector('.art').style.background = a && a.status === 'delivered' ? `center / cover url(${a.file})` : c.dataset.bg;
      }
      // Controller navigation: d-pad or left stick moves, A opens.
      const pad = createPad();
      let sel = -1, held = 0;
      const pick = (i) => { sel = (i + cards.length) % cards.length; cards.forEach((c, j) => c.classList.toggle('sel', j === sel)); cards[sel].focus(); };
      (function loop() {
        pad.poll();
        if (pad.kind === 'controller') {
          const s = pad.ls();
          const dir = pad.pressed(BTN.RIGHT) || pad.pressed(BTN.DOWN) ? 1 : pad.pressed(BTN.LEFT) || pad.pressed(BTN.UP) ? -1 : 0;
          const sd = Math.abs(s.x) > 0.6 || Math.abs(s.y) > 0.6 ? Math.sign(s.x || s.y) : 0;
          if (dir) pick(sel + dir);
          else if (sd && !held) pick(sel + sd);
          held = sd;
          if (pad.pressed(BTN.A)) { if (sel < 0) pick(0); else location.href = cards[sel].href; }
        }
        requestAnimationFrame(loop);
      })();
    });
  </script>
</body>
</html>
