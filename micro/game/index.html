<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14231b">
  <title>Micro Zoom</title>
  <meta name="description" content="Micro Zoom: play as microscopic creatures, from a springtail on a bog pool's surface film down through moss, water film, pool and sediment to a bacteriophage beyond the reach of light. Reach a landmark and the microscope zooms into the next world.">
  <link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Micro Zoom">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <!-- Black until the title's fonts, logo and plates are in (inline so it paints before the stylesheet). -->
  <style>
    html, body { background: #000; }
    #boot { position: fixed; inset: 0; z-index: 1000; background: #000; transition: opacity .8s ease; }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .bar { position: absolute; left: 50%; top: 62%; width: min(320px, 60vw); height: 2px; transform: translateX(-50%);
      background: rgba(200, 155, 71, .18); opacity: 0; transition: opacity .5s ease; }
    #boot.slow .bar { opacity: 1; }
    #boot .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #e2bd6e; transition: width .35s ease; }
  </style>
  <link rel="stylesheet" href="src/style.css">
  <!-- Visit counting (GoatCounter: no cookies, no identifiers), read by games.hoai.net/stats/. -->
  <script>window.goatcounter = { path: function () { return location.pathname; } };</script>
  <script data-goatcounter="https://hoai.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <div id="boot" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-t-aria="shell.title.loadingArt"><div class="bar"><i></i></div></div>
  <div id="app">
    <div id="frame-host" aria-hidden="true" inert></div>
    <canvas id="title-bg" aria-hidden="true"></canvas>
    <div id="menu-veil" class="blackout" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" data-t-aria="shell.title.loadingArt"><div class="bar"><i></i></div></div>

    <!-- Title -->
    <section id="title" class="screen" aria-labelledby="logo-text">
      <div id="title-art-loading" class="art-loading" role="status" data-t-aria="shell.title.loadingArt"></div>
      <div class="title-block">
        <p class="eyebrow"><span data-t="shell.title.eyebrowWorlds"></span><i></i><span data-t-html="shell.title.eyebrowRange"></span></p>
        <img id="logo-img" alt="" hidden>
        <h1 id="logo-text" class="logo-type visually-hidden"><span class="w1" data-t="shell.title.logoWord1"></span><span class="w2">Z<span class="lens" aria-hidden="true"></span><span class="lens" aria-hidden="true"></span>m</span><span class="visually-hidden" data-t="shell.title.logoName"></span></h1>
        <div class="vernier" aria-hidden="true" hidden></div>
        <button id="press-start" class="press-start" data-nav data-action="start" data-t="shell.title.pressStart"></button>
        <div class="players-row" aria-live="polite"></div>
      </div>
      <div class="corner-buttons" data-group="corner"></div>
    </section>

    <!-- World select -->
    <section id="menu" class="screen" hidden aria-labelledby="menu-title">
      <div class="menu-bg" aria-hidden="true"><div class="grid"></div><div class="glow"></div></div>
      <header class="screen-head">
        <div>
          <p class="eyebrow small"><span data-t="shell.menu.eyebrowTray"></span><i></i><span data-t="shell.menu.eyebrowLevels"></span></p>
          <h2 id="menu-title" data-t="shell.menu.heading"></h2>
        </div>
        <div class="players-row" aria-live="polite"></div>
      </header>
      <div class="carousel" id="cards" role="listbox" data-t-aria="shell.menu.worldsLabel"></div>
      <div class="scale-rule" id="scale-rule" aria-hidden="true"></div>
      <div class="corner-buttons" data-group="corner"></div>
    </section>

    <!-- World intro -->
    <section id="intro" class="screen" hidden aria-labelledby="intro-name">
      <div class="intro-art" aria-hidden="true"></div>
      <div class="intro-shade" aria-hidden="true"></div>
      <article class="intro-panel paper">
        <p class="eyebrow small"><span id="intro-no"></span><i></i><span id="intro-look"></span></p>
        <h2 id="intro-name"></h2>
        <p class="latin"><span id="intro-creature"></span> · <em id="intro-latin"></em></p>
        <dl class="plate" id="intro-plate"></dl>
        <h3 data-t="shell.intro.goal"></h3><p class="goal" id="intro-goal"></p>
        <div class="intro-cols">
          <div>
            <h3 data-t="shell.intro.controls"></h3><ul class="controls-list" id="intro-controls"></ul>
          </div>
          <div>
            <h3 data-t="shell.intro.fieldNotes"></h3><ul class="facts" id="intro-facts"></ul>
          </div>
        </div>
        <div class="intro-actions">
          <button class="press-start small" data-nav data-action="begin" data-t-html="shell.intro.begin"></button>
          <button class="text-btn" data-nav data-action="back" data-t-html="shell.intro.back"></button>
        </div>
      </article>
    </section>

    <!-- Play -->
    <section id="play" class="screen" hidden data-t-aria="shell.play.label">
      <div class="play-hud">
        <div class="plaque" id="plaque"><span class="no"></span><span class="nm"></span><span class="mg"></span></div>
        <div class="hud-buttons">
          <button class="icon-btn small" data-action="controls" aria-pressed="false" data-t-aria="shell.play.controlsAria" data-t-title="shell.play.controlsTitle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 10h4M9 8v4M15 9.5h.01M17 11.5h.01M7 15h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span class="btn-label" data-t="shell.play.controlsButton"></span>
          </button>
          <button class="icon-btn small" data-action="pause" data-t-aria="shell.play.pauseButton" data-t-title="shell.play.pauseTitle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5v14M15.5 5v14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
            <span class="btn-label" data-t="shell.play.pauseButton"></span>
          </button>
        </div>
      </div>
      <aside id="controls-card" class="controls-card paper" hidden aria-live="polite"></aside>
      <div id="prompt" class="landmark-prompt" hidden></div>
      <div id="veil" class="veil" hidden><div class="objective-spin" aria-hidden="true"></div><p data-t="shell.play.preparing"></p></div>
    </section>

    <!-- Transition between worlds -->
    <div id="transition" class="transition" hidden aria-live="polite">
      <canvas aria-hidden="true"></canvas>
      <div class="tr-ring" aria-hidden="true"></div>
      <div class="tr-caption"><p class="eyebrow small"><span class="tr-dir"></span></p><h2 class="tr-title"></h2></div>
      <div class="tr-readout"><span class="tr-field"></span><span class="tr-mag"></span></div>
    </div>

    <!-- Pause -->
    <section id="pause" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="panel paper pause-panel">
        <p class="eyebrow small"><span id="pause-world"></span></p>
        <h2 id="pause-title" data-t="shell.pause.heading"></h2>
        <p id="pause-reason" class="muted"></p>
        <div class="menu-list">
          <button class="menu-btn primary" data-nav data-action="resume" data-t="shell.pause.resume"></button>
          <button class="menu-btn" data-nav data-open="instructions" data-t="shell.pause.instructions"></button>
          <button class="menu-btn" data-nav data-open="settings" data-t="shell.pause.settings"></button>
          <button class="menu-btn" data-nav data-action="choose" data-t="shell.pause.choose"></button>
        </div>
        <div class="players-row"></div>
      </div>
      <div class="corner-buttons" data-group="corner-pause"></div>
    </section>

    <!-- Settings -->
    <section id="settings" class="modal dialog" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="panel paper">
        <h2 id="settings-title" data-t="shell.settings.heading"></h2>
        <div class="settings-list" id="settings-list"></div>
        <button class="menu-btn" data-nav data-action="close" data-t="shell.settings.done"></button>
      </div>
    </section>

    <!-- Instructions -->
    <section id="instructions" class="modal dialog" hidden role="dialog" aria-modal="true" aria-labelledby="ins-title">
      <div class="panel paper wide">
        <h2 id="ins-title" data-t="shell.instructions.heading"></h2>
        <div class="scroll" id="ins-scroll" tabindex="0" data-nav data-scroll></div>
        <button class="menu-btn" data-nav data-action="close" data-t="shell.instructions.close"></button>
      </div>
    </section>

    <!-- Credits -->
    <section id="credits" class="modal dialog" hidden role="dialog" aria-modal="true" aria-labelledby="credits-title">
      <div class="panel paper">
        <h2 id="credits-title" data-t="shell.credits.heading"></h2>
        <div class="scroll credits" id="credits-scroll" tabindex="0" data-nav data-scroll></div>
        <button class="menu-btn" data-nav data-action="close" data-t="shell.credits.close"></button>
      </div>
    </section>

    <!-- Confirm -->
    <section id="confirm" class="modal dialog" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="panel paper narrow">
        <h2 id="confirm-title"></h2>
        <p id="confirm-text" class="muted"></p>
        <div class="row-buttons">
          <button class="menu-btn" data-nav data-action="cancel" data-t="shell.confirm.stay"></button>
          <button class="menu-btn primary" data-nav data-action="ok" data-t="shell.confirm.leave"></button>
        </div>
      </div>
    </section>

    <div id="toasts" class="toasts" aria-live="polite"></div>
  </div>
  <script type="module" src="src/boot.js"></script>
</body>
</html>
