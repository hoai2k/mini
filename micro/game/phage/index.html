<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phage · Micro prototypes</title>
  <meta name="description" content="Drift, walk and inject as a T4-like bacteriophage in bog water, drawn as a Goodsell-style molecular illustration (or cryo-EM greyscale).">
  <link rel="icon" href="../../../favicon.ico">
  <link rel="stylesheet" href="../shared/hud.css">
  <style>
    .ph-card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: min(440px, calc(100vw - 32px));
      background: rgba(10,12,16,.82); backdrop-filter: blur(8px); border-radius: 12px; padding: 16px 20px; text-align: center; display: none; z-index: 25; }
    .ph-card.show { display: block; }
    .ph-card h2 { margin: 0 0 6px; font-size: 18px; } .ph-card p { margin: 0 0 6px; color: #c9d1da; font-size: 13px; } .ph-card .go { color: #9fd0ff; margin-top: 8px; }
    .ph-tag { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(10,12,16,.72); color: #ffe14a;
      border: 1px solid #ffe14a; border-radius: 999px; padding: 3px 12px; font: 600 12px system-ui, sans-serif; display: none; z-index: 4; white-space: nowrap; }
    .ph-tag.show { display: block; }
    .ph-label { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); color: rgba(20,24,32,.75); background: rgba(255,255,255,.55);
      border-radius: 999px; padding: 2px 10px; font: 11px system-ui, sans-serif; pointer-events: none; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
    .ph-scale { position: fixed; left: 16px; bottom: 16px; color: #1a1f27; font: 12px system-ui, sans-serif; pointer-events: none; text-shadow: 0 0 3px #fff; }
    .ph-scale i { display: block; height: 3px; background: #1a1f27; margin-bottom: 3px; box-shadow: 0 0 3px #fff; }
    .ph-prog { position: fixed; left: 50%; top: 44px; transform: translateX(-50%); width: min(360px, calc(100vw - 32px)); background: rgba(10,12,16,.62);
      border-radius: 8px; padding: 5px 10px 7px; font: 12px system-ui, sans-serif; color: #eef1f4; display: none; z-index: 4; }
    .ph-prog { background: rgba(28,24,14,.78); border: 1px solid #b8913f; color: #f3e7c4; font: 600 11px/1.3 system-ui, sans-serif; letter-spacing: .03em; }
    .ph-prog i, .ph-prog b { display: block; height: 4px; margin: 3px 0 5px; border-radius: 2px; background: linear-gradient(90deg, #8a6a2a, #e3c47a); box-shadow: 0 0 0 1px rgba(184,145,63,.35); }
    .ph-prog b { background: linear-gradient(90deg, #7a3040, #ff6a7a); margin-bottom: 0; }
    .ph-prog .lock { color: #d9c6a0; font-weight: 500; }
    .ph-prog.hot { border-color: #ff6a7a; } .ph-prog.hot .lock { color: #ff8a96; }
    .ph-data { position: fixed; transform: translate(-50%, -100%); background: rgba(10,12,16,.72); color: #fff3b0; border-left: 3px solid #ffe14a;
      padding: 3px 8px; border-radius: 4px; font: 11px/1.35 system-ui, sans-serif; pointer-events: none; max-width: 260px; z-index: 3; }
  </style>
</head>
<body>
  <canvas class="view"></canvas>
  <script type="module">
    import { boot } from '../shared/boot.js';
    boot(() => import('./main.js'));
  </script>
</body>
</html>
