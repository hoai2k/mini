<!doctype html>
<html lang="en" data-theme="classic" data-mode="dark" class="text-pending">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1510">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Music Practice">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-metronome-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-metronome-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-metronome-192.png">
  <title>Music Practice</title>
  <meta name="description" content="A metronome, a tuner, a drone and a practice recorder that hears when you start and stop playing, then plays your take back.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Each theme loads its own fonts (THEMES in src/settings.js); Classic's load here as the default. -->
  <link id="theme-fonts" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before the page draws (settings.js owns the list).
    try {
      var s = JSON.parse(localStorage.getItem('musicpractice.settings.v1') || '{}') || {};
      var ids = ['classic', 'deco', 'sixties', 'baroque', 'scifi', 'nouveau', 'anime', 'steampunk'];
      var t = s.themeChosen === true && ids.indexOf(s.theme) > 0 ? s.theme : 'classic';
      // In the iOS and Android apps, themes are part of Pro (src/pro.js keeps this answer).
      var app = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
      if (app && localStorage.getItem('musicpractice.pro') !== '1') { t = 'classic'; document.documentElement.classList.add('locked'); }
      // The apps bundle every theme's fonts (mobile/fonts/).
      if (app) document.getElementById('theme-fonts').href = 'fonts/' + t + '.css';
      document.documentElement.dataset.theme = t;
      // Light or dark (resolveMode in settings.js): the system's unless chosen.
      var a = s.appearanceChosen === true ? s.appearance : 'system', dark = ['classic', 'deco', 'scifi', 'steampunk'].indexOf(t) >= 0;
      if (a === 'light' || a === 'dark') dark = a === 'dark';
      else if (a === 'system') dark = matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.mode = dark ? 'dark' : 'light';
    } catch (e) { document.documentElement.dataset.theme = 'classic'; document.documentElement.dataset.mode = 'dark'; }
  </script>
</head>
<body>
  <!-- Gradients shared by the stand-in art in src/standins.js. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="walnut" x1="0" x2="1">
        <stop offset="0" stop-color="#5a3620"/><stop offset=".5" stop-color="#8a5a34"/><stop offset="1" stop-color="#4d2d19"/>
      </linearGradient>
      <linearGradient id="brass" x1="0" x2="1">
        <stop offset="0" stop-color="#a7782c"/><stop offset=".45" stop-color="#f0cf7a"/><stop offset="1" stop-color="#9b6c25"/>
      </linearGradient>
      <linearGradient id="cream" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#fbf3e2"/><stop offset="1" stop-color="#e9d9b9"/>
      </linearGradient>
      <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#8c6a1f"/><stop offset=".35" stop-color="#f6e2a0"/><stop offset=".6" stop-color="#d4af37"/><stop offset="1" stop-color="#7a5a17"/>
      </linearGradient>
      <linearGradient id="lacquer" x1="0" x2="1">
        <stop offset="0" stop-color="#050506"/><stop offset=".5" stop-color="#22232a"/><stop offset="1" stop-color="#050506"/>
      </linearGradient>
      <linearGradient id="ivory" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#fbf6e8"/><stop offset="1" stop-color="#e6dbc0"/>
      </linearGradient>
    </defs>
  </svg>

  <main id="app">

    <!-- Home: a big button for each tool -->
    <section id="home" class="screen" aria-labelledby="home-title">
      <button class="icon-btn home-gear" id="app-settings-btn" data-text-aria-label="home.settings"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#gear"/></svg></button>
      <h1 id="home-title" class="brand" data-text-rich="home.title"></h1>
      <button class="pill home-done" id="home-done" type="button" data-text="common.done" hidden></button>
      <!-- The Practice Routine as a second page, when it doesn't fit beside the others (?routine; main.js). -->
      <button class="page-arrow page-next" id="page-next" type="button" data-text-aria-label="home.nextPage" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="page-hint" id="page-hint" aria-hidden="true" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span>
      <div class="choices" id="choices">
        <a class="choice" href="#metronome" id="go-metronome" data-tool="metronome" draggable="false">
          <span class="art" data-asset="home-metronome"></span>
          <span class="label" data-text="home.tools.metronome"></span>
        </a>
        <a class="choice" href="#tuner" id="go-tuner" data-tool="tuner" draggable="false">
          <span class="art" data-asset="home-tuner"></span>
          <span class="label" data-text="home.tools.tuner"></span>
        </a>
        <!-- Add data-in-progress to a tool that isn't ready yet: its card fades and says so. -->
        <a class="choice" href="#drone" id="go-drone" data-tool="drone" draggable="false">
          <span class="art" data-asset="home-drone"></span>
          <span class="label"><span data-text="home.tools.drone"></span> <small class="in-progress-label" data-text="home.inProgress"></small><small class="pro-badge" data-text="home.proBadge"></small></span>
        </a>
        <a class="choice" href="#record" id="go-record" data-tool="record" draggable="false">
          <span class="art" data-asset="home-record"></span>
          <span class="label" data-text="home.tools.record"></span>
        </a>
      </div>
      <script>
        // Put the buttons in the saved order before the page draws (src/homeorder.js does the rest).
        try {
          var order = (JSON.parse(localStorage.getItem('musicpractice.settings.v1') || '{}') || {}).homeOrder;
          var box = document.getElementById('choices');
          var known = ['metronome', 'tuner', 'drone', 'record'];
          if (Array.isArray(order)) {
            // A tool added since the order was saved goes after the one it follows (settings.js does the same).
            known.forEach(function (id, i) {
              if (order.indexOf(id) >= 0) return;
              var prev = known.slice(0, i).reverse().filter(function (p) { return order.indexOf(p) >= 0; })[0];
              order.splice(prev ? order.indexOf(prev) + 1 : 0, 0, id);
            });
          }
          if (Array.isArray(order)) order.forEach(function (id) {
            var el = box.querySelector('[data-tool="' + id + '"]');
            if (el) box.appendChild(el);
          });
        } catch (e) { /* default order */ }
      </script>

      <dialog id="app-settings" class="sheet" aria-labelledby="app-settings-title">
        <form method="dialog">
          <header class="sheet-head"><h3 id="app-settings-title" data-text="appSettings.title"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <fieldset id="theme-field">
            <legend data-text="appSettings.theme"></legend>
            <div class="theme-tiles" id="theme-tiles" role="radiogroup" data-text-aria-label="appSettings.theme"></div>
          </fieldset>
          <fieldset id="appearance-field">
            <legend data-text="appSettings.appearance"></legend>
            <div class="chips" id="appearance-chips" data-text-aria-label="appSettings.appearance"></div>
          </fieldset>
          <button type="button" class="pill open-audio-check" data-text="common.audioCheck"></button>
          <button type="button" class="pill open-feedback" data-text="appSettings.sendFeedback"></button>
          <!-- In the apps only (src/pro.js). -->
          <fieldset id="pro-row" hidden>
            <legend data-text="appSettings.pro.title"></legend>
            <div class="row toggle"><span id="pro-status"></span><button type="button" class="pill" id="pro-open" data-text="appSettings.pro.openWhenOff"></button></div>
            <p class="help" id="pro-id-row" hidden><span data-text="appSettings.pro.appId"></span> <button type="button" class="link-btn" id="pro-id"></button> <span id="pro-id-copied" data-text="appSettings.pro.copied" hidden></span></p>
          </fieldset>
        </form>
      </dialog>
    </section>

    <!-- Metronome -->
    <section id="metronome" class="screen" aria-labelledby="met-title" hidden>
      <header class="bar">
        <a class="icon-btn" href="#" data-text-aria-label="common.backToStart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
        <h2 id="met-title" data-text="metronome.title"></h2>
        <button class="icon-btn" id="met-settings-btn" data-text-aria-label="metronome.settingsButton"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#gear"/></svg></button>
      </header>
      <div class="met-body">
        <div class="met-stage">
          <div class="met-visual" id="met-visual">
            <!-- Tap the metronome: its beat effect (Swing or Pulse) off and on. -->
            <div class="metronome" id="metronome-art" role="button" tabindex="0">
              <div class="met-layer met-case" id="metronome-case" data-asset="metronome-body"></div>
              <!-- The pendulum: its rod and bob, and the weight that slides along it with the tempo (drag it to set the tempo). -->
              <div class="met-layer met-pendulum" id="pendulum"><span class="met-rod" id="pend-rod" data-asset="metronome-rod"></span><span class="met-weight" id="pend-weight" data-asset="metronome-weight"></span></div>
            </div>
            <!-- Under it: the beat dots (big in Pulse), which open into the
                 Visualizer, rows of bars of music, as the metronome shrinks
                 above. Tap: dots or Visualizer; press and hold: strong beats. -->
            <div class="met-foot" id="met-foot" role="button" tabindex="0">
              <ol class="beats" id="beats" aria-hidden="true"></ol>
              <div class="met-viz" id="met-viz">
                <div class="met-bars" id="met-bars" aria-hidden="true"></div>
              </div>
            </div>
          </div>
          <!-- Volume, tucked away: drag the speaker up or down, or tap it to open the slider. -->
          <div class="tuck-vol" id="met-vol">
            <button type="button" class="tuck-vol-knob" id="met-vol-knob" aria-expanded="false" aria-controls="met-vol-panel" data-text-aria-label="common.volume">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="body" d="M4 9h4l5-4v14l-5-4H4z"/><path class="w1" d="M16 8.5a5 5 0 0 1 0 7"/><path class="w2" d="M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
            </button>
            <div class="tuck-vol-panel" id="met-vol-panel">
              <div class="vslider" id="met-vol-slider" role="slider" tabindex="-1" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" data-text-aria-label="common.volume">
                <div class="vslider-track"><div class="vslider-fill"></div><div class="vslider-thumb"></div></div>
              </div>
            </div>
          </div>
        </div>
        <div class="met-controls">
          <div class="tempo">
            <button class="step" id="bpm-down" data-text-aria-label="metronome.slower">−</button>
            <label class="bpm-box">
              <input id="bpm-input" type="number" inputmode="numeric" min="40" max="500" step="1" value="120" data-text-aria-label="metronome.tempoInput" enterkeyhint="done">
              <span data-text="metronome.bpm"></span>
            </label>
            <button class="step" id="bpm-up" data-text-aria-label="metronome.faster">+</button>
          </div>
          <button type="button" class="marking" id="marking" aria-haspopup="dialog"></button>
          <input id="bpm-slider" class="slider" type="range" min="40" max="500" step="1" value="120" data-text-aria-label="metronome.tempoSlider">
          <div class="slider-scale" aria-hidden="true"><span>40</span><span>500</span></div>
          <button class="big-btn" id="met-toggle" aria-pressed="false">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            <span id="met-toggle-label" data-text="metronome.start"></span>
          </button>
          <p class="meter-note" id="meter-note"></p>
        </div>
        <!-- Line up the visuals with the sound (Bluetooth speakers play late). -->
        <div class="sync-bar" id="sync-bar" hidden>
          <h3 class="sync-title" data-text="metronome.sync.title"></h3>
          <p class="help" data-text="metronome.sync.help"></p>
          <div class="tempo">
            <button class="step" id="sync-down" type="button" data-text-aria-label="metronome.sync.sooner">−</button>
            <output class="sync-val" id="sync-val" aria-live="polite"></output>
            <button class="step" id="sync-up" type="button" data-text-aria-label="metronome.sync.later">+</button>
          </div>
          <p class="help" data-text="metronome.sync.tapHelp"></p>
          <button class="big-btn sync-tap" id="sync-tap" type="button" data-text="metronome.sync.tap"></button>
          <p class="help sync-status" id="sync-status" aria-live="polite"></p>
          <button class="pill" id="sync-done" type="button" data-text="common.done"></button>
        </div>
      </div>

      <dialog id="met-settings" class="sheet" aria-labelledby="met-settings-title">
        <form method="dialog">
          <header class="sheet-head"><h3 id="met-settings-title" data-text="metronome.settings.title"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <label class="row toggle"><span data-text="metronome.settings.timeSignature"></span><select class="select" id="meter"></select></label>
          <div class="row toggle accent-row">
            <span class="accent-name"><label for="accent" id="accent-label" data-text="metronome.settings.accent"></label><button type="button" class="icon-btn accent-edit" id="accent-edit" data-text-aria-label="metronome.accents.edit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button></span>
            <input type="checkbox" id="accent" role="switch">
          </div>
          <div class="row toggle accent-row">
            <span class="accent-name"><label for="sub-on" id="sub-label"></label><button type="button" class="icon-btn accent-edit" id="sub-edit" data-text-aria-label="metronome.settings.subEdit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button></span>
            <input type="checkbox" id="sub-on" role="switch">
          </div>
          <label class="row toggle"><span data-text="metronome.settings.sound"></span><select class="select" id="sound"></select></label>
          <!-- Settings for what can be shown, whether or not it is showing: a tap on the
               metronome turns the swing on or off, a tap on the dots shows the next
               of small dots, big dots and the Visualizer. -->
          <label class="row toggle"><span data-text="metronome.settings.swing"></span><input type="checkbox" id="pend-on" role="switch"></label>
          <label class="row toggle"><span data-text="metronome.settings.vizBars"></span><select class="select" id="viz-bars"></select></label>
          <div class="sheet-links">
            <button type="button" class="pill open-audio-check" data-text="common.audioCheck"></button>
            <button type="button" class="pill open-theme" data-text="common.themeButton"></button>
          </div>
        </form>
      </dialog>

      <!-- Extra notes between the beats: which kind (main.js). -->
      <dialog id="sub-editor" class="sheet" aria-labelledby="sub-editor-title">
        <form method="dialog">
          <header class="sheet-head"><h3 id="sub-editor-title" data-text="metronome.settings.subTitle"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <div class="chips" id="sub-chips"></div>
        </form>
      </dialog>

      <!-- Custom strong beats: every place a click falls in the bar (main.js). -->
      <dialog id="accent-editor" class="sheet" aria-labelledby="accent-editor-title">
        <form method="dialog">
          <header class="sheet-head"><h3 id="accent-editor-title" data-text="metronome.accents.title"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <div class="accent-grid" id="accent-grid"></div>
          <div class="accent-actions">
            <button type="button" class="pill" id="accent-clear" data-text="metronome.accents.clear"></button>
            <button type="button" class="pill accent-done" id="accent-done" data-text="common.done"></button>
          </div>
        </form>
      </dialog>

      <!-- Common tempos, from the marking under the number (main.js). -->
      <dialog id="tempo-picker" class="sheet" aria-labelledby="tempo-picker-title">
        <form method="dialog">
          <header class="sheet-head"><h3 id="tempo-picker-title" data-text="metronome.tempos.title"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <label class="row toggle"><span data-text="metronome.tempos.genre"></span><select class="select" id="tempo-genre"></select></label>
          <div class="tempo-list" id="tempo-list"></div>
        </form>
      </dialog>
    </section>

    <!-- Record / Playback -->
    <section id="record" class="screen" aria-labelledby="rec-title" hidden>
      <header class="bar">
        <a class="icon-btn" href="#" data-text-aria-label="common.backToStart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
        <h2 id="rec-title" data-text="recorder.title"></h2>
        <button class="icon-btn" id="rec-settings-btn" data-text-aria-label="recorder.settingsButton"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#gear"/></svg></button>
      </header>
      <div class="rec-top">
        <button class="rec-btn" id="rec-toggle" aria-pressed="false" data-state="off">
          <span class="rec-dot" aria-hidden="true"></span>
          <span class="visually-hidden" id="rec-toggle-label"></span>
        </button>
        <div class="rec-status" aria-live="polite">
          <p class="rec-state" id="rec-state"></p>
          <p class="rec-hint" id="rec-hint"></p>
        </div>
        <button class="pill" id="rec-skip" data-text="recorder.stopPlayback" hidden></button>
        <!-- How loud takes play back, tucked away (tuckedvolume.js). -->
        <div class="tuck-vol" id="rec-vol">
          <button type="button" class="tuck-vol-knob" aria-expanded="false" data-text-aria-label="recorder.playbackVolume">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="body" d="M4 9h4l5-4v14l-5-4H4z"/><path class="w1" d="M16 8.5a5 5 0 0 1 0 7"/><path class="w2" d="M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
          </button>
          <div class="tuck-vol-panel">
            <div class="vslider" role="slider" tabindex="-1" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" data-text-aria-label="recorder.playbackVolume">
              <div class="vslider-track"><div class="vslider-fill"></div><div class="vslider-thumb"></div></div>
            </div>
          </div>
        </div>
      </div>
      <aside class="mic-tip" id="mic-tip" aria-live="polite" hidden></aside>
      <aside class="mic-tip mic-off" id="rec-mic-off" aria-live="polite" hidden></aside>
      <canvas class="wave" id="wave" data-text-aria-label="recorder.waveform" role="img"></canvas>
      <h3 class="takes-title"><span data-text="recorder.takesTitle"></span> <span id="takes-count"></span></h3>
      <ul class="takes" id="takes"></ul>
      <p class="takes-empty" id="takes-empty"></p>
      <p class="toast note" id="note" role="status" hidden></p>
      <div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button class="pill" id="toast-undo" data-text="common.undo"></button></div>

      <dialog id="rec-settings" class="sheet" aria-labelledby="rec-settings-title">
        <form method="dialog">
          <header class="sheet-head"><h3 id="rec-settings-title" data-text="recorder.settings.title"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <label class="row"><span id="silence-label"></span><input type="range" class="slider" id="silence" min="1" max="10" step="0.5"></label>
          <fieldset>
            <legend data-text="recorder.settings.startOn"></legend>
            <div class="chips" id="starton-chips"></div>
            <p class="help" data-text="recorder.settings.startOnHelp"></p>
          </fieldset>
          <fieldset>
            <legend data-text="recorder.settings.sensitivity"></legend>
            <div class="chips" id="sens-chips"></div>
            <p class="help" data-text="recorder.settings.sensitivityHelp"></p>
          </fieldset>
          <label class="row toggle"><span data-text="recorder.settings.autoplay"></span><input type="checkbox" id="autoplay" role="switch"></label>
          <!-- Parked: "Record during playback" is hidden for now (see RECORD_DURING_PLAYBACK in src/main.js). -->
          <div hidden>
            <label class="row toggle"><span data-text="recorder.settings.during"></span><input type="checkbox" id="rec-during" role="switch" aria-describedby="rec-during-help"></label>
            <p class="help" id="rec-during-help" data-text="recorder.settings.duringHelp"></p>
          </div>
          <div class="sheet-links">
            <button type="button" class="pill open-audio-check" data-text="common.audioCheck"></button>
            <button type="button" class="pill open-theme" data-text="common.themeButton"></button>
          </div>
        </form>
      </dialog>
    </section>

    <!-- Tuner -->
    <section id="tuner" class="screen" aria-labelledby="tuner-title" hidden>
      <header class="bar">
        <a class="icon-btn" href="#" data-text-aria-label="common.backToStart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
        <h2 id="tuner-title" data-text="tuner.title"></h2>
        <button class="icon-btn" id="tuner-settings-btn" data-text-aria-label="tuner.settingsButton"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#gear"/></svg></button>
      </header>
      <div class="tuner-body" id="tuner-body" data-state="idle">
        <label class="tuner-instrument"><span class="visually-hidden" data-text="common.instrument"></span><select class="select" id="tuning-select"></select></label>
        <div class="gauge-wrap">
          <svg class="gauge" id="gauge" viewBox="0 0 320 196" aria-hidden="true">
            <path class="gauge-zone" id="gauge-zone"/>
            <g id="gauge-ticks"></g>
            <text class="gauge-flat" x="40" y="78">♭</text>
            <text class="gauge-sharp" x="280" y="78">♯</text>
            <g id="needle"><line x1="160" y1="176" x2="160" y2="40"/><circle cx="160" cy="176" r="9"/></g>
          </svg>
          <div class="tuner-note" aria-live="off"><span id="tn-letter">–</span><span class="acc" id="tn-acc"></span><span class="oct" id="tn-oct"></span></div>
        </div>
        <p class="tuner-readout"><span id="tn-cents">&nbsp;</span><span id="tn-hz"></span></p>
        <p class="tuner-hint" id="tn-hint" aria-live="polite"></p>
        <aside class="mic-tip mic-off" id="tn-mic-off" aria-live="polite" hidden></aside>
        <div class="strings" id="strings" role="group" data-text-aria-label="tuner.strings"></div>
        <button class="pill" id="ref-tone" type="button"></button>
        <!-- Test Scale Intonation (in testing: only with ?scale; tunerui.js, scaletest.js). -->
        <div class="scale-test" id="scale-test" hidden>
          <button class="pill" id="scale-start" type="button" data-text="tuner.scale.button"></button>
          <div class="scale-live" id="scale-live" hidden>
            <p class="scale-status" id="scale-status" aria-live="polite"></p>
            <button class="link-btn" id="scale-cancel" type="button" data-text="tuner.scale.cancel"></button>
          </div>
        </div>
        <p class="tuner-status" id="tuner-status" hidden></p>
        <button class="pill" id="tuner-retry" type="button" data-text="common.tryAgain" hidden></button>
      </div>

      <dialog id="scale-results" class="sheet" aria-labelledby="scale-results-title">
        <form method="dialog">
          <header class="sheet-head"><h3 id="scale-results-title" data-text="tuner.scale.resultsTitle"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <p class="scale-summary" id="scale-summary"></p>
          <ol class="scale-notes" id="scale-notes"></ol>
          <p class="help" id="scale-help"></p>
          <div class="sheet-links">
            <button type="button" class="pill" id="scale-again" data-text="tuner.scale.again"></button>
            <button class="pill" value="close" data-text="tuner.scale.done"></button>
          </div>
        </form>
      </dialog>

      <dialog id="tuner-settings" class="sheet" aria-labelledby="tuner-settings-title">
        <form method="dialog">
          <header class="sheet-head"><h3 id="tuner-settings-title" data-text="tuner.settings.title"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <div class="row">
            <span id="a4-label"></span>
            <div class="a4-row">
              <button type="button" class="step" id="a4-down" data-text-aria-label="common.lowerByOneHz">−</button>
              <input type="range" class="slider" id="a4" min="415" max="466" step="1" data-text-aria-label="common.referencePitchSlider">
              <button type="button" class="step" id="a4-up" data-text-aria-label="common.higherByOneHz">+</button>
            </div>
          </div>
          <fieldset>
            <legend data-text="tuner.settings.noteNames"></legend>
            <div class="chips" id="flats-chips"></div>
          </fieldset>
          <label class="row"><span data-text="tuner.settings.transpose"></span><select class="select" id="transpose"></select></label>
          <div class="sheet-links">
            <button type="button" class="pill open-audio-check" data-text="common.audioCheck"></button>
            <button type="button" class="pill open-theme" data-text="common.themeButton"></button>
          </div>
        </form>
      </dialog>
    </section>

    <!-- Drone -->
    <section id="drone" class="screen" aria-labelledby="drone-title" hidden>
      <header class="bar">
        <a class="icon-btn" href="#" data-text-aria-label="common.backToStart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
        <h2 id="drone-title" data-text="drone.title"></h2>
        <button class="icon-btn" id="drone-settings-btn" data-text-aria-label="drone.settingsButton"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#gear"/></svg></button>
      </header>
      <div class="drone-body" id="drone-body">
        <div class="drone-stage">
          <!-- The cello (cello voices) or the organ (organ voices), droneui.js showVoiceArt. -->
          <div class="drone-art" aria-hidden="true"><div class="drone-glow"></div><span class="art" id="dr-art" data-asset="drone-cello"></span><span class="art" id="dr-art-organ" data-asset="drone-organ" hidden></span></div>
          <!-- The organ's volume: a plain upright slider (drag the knob up or down). -->
          <div class="vslider" id="dr-vol" role="slider" tabindex="0" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" data-text-aria-label="common.volume" hidden>
            <svg class="vslider-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
            <div class="vslider-track"><div class="vslider-fill"></div><div class="vslider-thumb"></div></div>
          </div>
          <!-- The cello's volume: its bow stands beside it, lit behind from the frog up to the level, with its label under it. -->
          <div class="bow-col" id="dr-bow-col">
            <div class="bow-slider" id="dr-bow" role="slider" tabindex="0" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" data-text-aria-label="common.volume">
              <span class="art" data-asset="drone-bow"></span>
              <div class="bow-hair"><div class="bow-lit"></div><div class="bow-mark"></div></div>
            </div>
            <span class="bow-label" aria-hidden="true" data-text="common.volume"></span>
          </div>
        </div>
        <div class="drone-readout">
          <div class="tuner-note drone-note"><span id="dr-letter"></span><span class="acc" id="dr-acc"></span><span class="oct" id="dr-oct"></span></div>
          <button type="button" class="drone-hz" id="dr-hz" aria-pressed="false"><span id="dr-hz-val"></span> <span class="drone-fifth-tag" id="dr-fifth-tag" data-text="drone.withFifth"></span></button>
        </div>
        <div class="tempo drone-pitch">
          <button class="step" id="dr-down" type="button" data-text-aria-label="drone.down">−</button>
          <label><span class="visually-hidden" data-text="drone.pitch"></span><select class="select" id="dr-pitch"></select></label>
          <button class="step" id="dr-up" type="button" data-text-aria-label="drone.up">+</button>
        </div>
        <label class="drone-voice"><span class="visually-hidden" data-text="common.instrument"></span><select class="select" id="dr-voice"></select></label>
        <button class="big-btn" id="dr-toggle" type="button" aria-pressed="false">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <span id="dr-toggle-label" data-text="drone.play"></span>
        </button>
        <!-- How long the drone has played (counting while it plays; after, the last one's length). -->
        <p class="drone-elapsed" id="dr-elapsed"></p>
        <p class="drone-timer" id="dr-timer" aria-live="polite" hidden></p>
      </div>

      <dialog id="drone-settings" class="sheet" aria-labelledby="drone-settings-title">
        <form method="dialog">
          <header class="sheet-head"><h3 id="drone-settings-title" data-text="drone.settings.title"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <div class="met-display">
            <div class="met-tabs" id="dr-mode-tabs" role="radiogroup" data-text-aria-label="drone.settings.timing"></div>
            <div class="met-tab-panel">
              <div class="met-art-opts" id="dr-continuous-opts">
                <label class="row toggle"><span data-text="drone.settings.loop"></span><input type="checkbox" id="dr-loop" role="switch"></label>
                <label class="row" id="dr-length-row"><span id="dr-length-label"></span><input type="range" class="slider" id="dr-length" min="1" max="60" step="1"></label>
              </div>
              <div class="met-viz-opts" id="dr-change-opts">
                <label class="row"><span id="dr-step-label"></span><input type="range" class="slider" id="dr-step" min="0.5" max="20" step="0.5"></label>
                <label class="row"><span data-text="drone.settings.then"></span><select class="select" id="dr-then"></select></label>
                <p class="help" data-text="drone.settings.timedHelp"></p>
              </div>
            </div>
          </div>
          <label class="row toggle"><span data-text="drone.settings.fifth"></span><input type="checkbox" id="dr-fifth" role="switch"></label>
          <p class="help" data-text="drone.settings.fifthHelp"></p>
          <fieldset>
            <legend data-text="drone.settings.accidentals"></legend>
            <div class="chips" id="dr-accidentals"></div>
          </fieldset>
          <p class="help" data-text="drone.settings.accidentalsHelp"></p>
          <div class="row">
            <span class="dr-a4-label"></span>
            <div class="a4-row">
              <button type="button" class="step dr-a4-down" data-text-aria-label="common.lowerByOneHz">−</button>
              <input type="range" class="slider dr-a4" min="415" max="466" step="1" data-text-aria-label="common.referencePitchSlider">
              <button type="button" class="step dr-a4-up" data-text-aria-label="common.higherByOneHz">+</button>
            </div>
            <p class="help" data-text="drone.settings.a4Help"></p>
          </div>
          <div class="sheet-links">
            <button type="button" class="pill open-audio-check" data-text="common.audioCheck"></button>
            <button type="button" class="pill open-theme" data-text="common.themeButton"></button>
          </div>
        </form>
      </dialog>
    </section>

    <!-- Practice Routine (in development: only with ?routine in the address). A
         list of practice items, each a name, minutes and its own metronome
         and drone; Start runs through them (timerui.js). -->
    <section id="routine" class="screen" aria-labelledby="timer-title" hidden>
      <header class="bar">
        <a class="icon-btn" href="#" id="timer-back" data-text-aria-label="common.backToStart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
        <h2 id="timer-title" data-text="timer.title"></h2>
        <button class="icon-btn" id="timer-settings-btn" type="button" data-text-aria-label="timer.settingsButton"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#gear"/></svg></button>
      </header>
      <div class="timer-body">
        <!-- What is running now (or, before Start, the whole routine's length). -->
        <div class="timer-now" id="timer-now">
          <span class="art timer-art" data-asset="home-routine" aria-hidden="true"></span>
          <!-- While an item runs, its picture, large (timer.js pictureFor). -->
          <span class="art timer-picture" id="timer-picture" data-asset="home-routine" aria-hidden="true"></span>
          <div class="timer-readout">
            <p class="timer-name" id="timer-name"></p>
            <p class="timer-clock" id="timer-clock" role="timer" aria-live="off"></p>
            <div class="timer-progress" aria-hidden="true"><div class="timer-progress-fill" id="timer-fill"></div></div>
            <p class="timer-sub" id="timer-sub"></p>
          </div>
          <div class="timer-actions">
            <button class="big-btn" id="timer-go" type="button" aria-pressed="false">
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
              <span id="timer-go-label" data-text="timer.start"></span>
            </button>
            <div class="timer-side" id="timer-side" hidden>
              <button class="pill" id="timer-skip" type="button" data-text="timer.skip"></button>
              <button class="pill" id="timer-stop" type="button" data-text="timer.stop"></button>
            </div>
          </div>
        </div>
        <ol class="timer-list" id="timer-list"></ol>
        <p class="help timer-empty" id="timer-empty" data-text="timer.empty" hidden></p>
        <button class="pill timer-add" id="timer-add" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-text="timer.add"></span></button>
        <p class="timer-toast" id="timer-toast" role="status" aria-live="polite" hidden><span id="timer-toast-text"></span> <button type="button" class="link-btn" id="timer-undo" data-text="timer.undo"></button></p>
      </div>

      <dialog id="timer-settings" class="sheet" aria-labelledby="timer-settings-title">
        <form method="dialog">
          <header class="sheet-head"><h3 id="timer-settings-title" data-text="timer.settingsTitle"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <fieldset>
            <legend data-text="timer.chime"></legend>
            <div class="chips" id="timer-chime"></div>
          </fieldset>
          <p class="help" data-text="timer.chimeHelp"></p>
        </form>
      </dialog>

      <!-- + : the suggestions, or Custom… -->
      <dialog id="timer-add-sheet" class="sheet" aria-labelledby="timer-add-title">
        <form method="dialog">
          <header class="sheet-head"><h3 id="timer-add-title" data-text="timer.addTitle"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <div class="timer-presets" id="timer-presets"></div>
        </form>
      </dialog>
    </section>
    <!-- The paywall, in the iOS and Android apps (src/pro.js). -->
    <dialog id="paywall" class="sheet paywall" aria-labelledby="pw-title">
      <form method="dialog">
        <header class="sheet-head"><h3 id="pw-title" data-text="paywall.title"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
        <p class="pw-have" id="pw-have" hidden></p>
        <ul class="pw-features">
          <li data-text-rich="paywall.features.drone"></li>
          <li data-text-rich="paywall.features.takes"></li>
          <li data-text-rich="paywall.features.themes"></li>
          <li data-text="paywall.features.free"></li>
        </ul>
        <p class="pw-support" data-text="paywall.support"></p>
        <div class="pw-plans" id="pw-plans"></div>
        <p class="help pw-note" id="pw-note" hidden></p>
        <p class="pw-message" id="pw-message" role="status" aria-live="polite"></p>
        <div class="pw-links">
          <button type="button" class="link-btn" id="pw-restore" data-text="paywall.restore"></button>
          <button type="button" class="link-btn" id="pw-redeem" data-text="paywall.redeem"></button>
        </div>
        <p class="help pw-fine" id="pw-fine"></p>
        <p class="help pw-legal"><a id="pw-terms" href="#" target="_blank" rel="noopener" data-text="paywall.terms"></a> · <a id="pw-privacy" href="#" target="_blank" rel="noopener" data-text="paywall.privacy"></a></p>
      </form>
    </dialog>

    <!-- Audio check: what the browser reports about mics, speakers and
         permission, and the choices it allows (src/audiocheck.js). -->
    <!-- Theme, from any mini app's settings: the main settings' theme tiles
         and Dark Mode, moved in while this is open (main.js openThemeSheet). -->
    <dialog id="theme-sheet" class="sheet" aria-labelledby="theme-sheet-title">
      <form method="dialog">
        <header class="sheet-head"><h3 id="theme-sheet-title" data-text="appSettings.theme"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
        <div id="theme-sheet-body"></div>
      </form>
    </dialog>

    <dialog id="audio-check" class="sheet" aria-labelledby="audio-check-title">
      <form method="dialog">
        <header class="sheet-head"><h3 id="audio-check-title" data-text="audioCheck.title"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
        <div id="audio-check-body" aria-live="polite"></div>
        <button type="button" class="pill open-feedback" data-topic="Problem" data-text="audioCheck.reportProblem"></button>
      </form>
    </dialog>

    <!-- Send feedback (src/feedback.js): to the shared feedback inbox. -->
    <dialog id="feedback" class="sheet" aria-labelledby="fb-title">
      <form method="dialog">
        <header class="sheet-head"><h3 id="fb-title" data-text="feedback.title"></h3><button class="icon-btn" value="close" data-text-aria-label="common.close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
        <p class="help" data-text="feedback.intro"></p>
        <p class="help fb-req-note"><span class="req" aria-hidden="true">*</span> <span data-text="feedback.requiredNote"></span></p>
        <div class="chips" id="fb-topic" data-text-aria-label="feedback.topicLabel"></div>
        <label class="fb-field"><span data-text="feedback.email"></span><input type="email" id="fb-email" class="fb-input" autocomplete="email" inputmode="email" maxlength="254" enterkeyhint="next"></label>
        <label class="fb-field"><span><span data-text="feedback.message"></span> <span class="req" aria-hidden="true">*</span></span><textarea id="fb-message" class="fb-input" rows="5" maxlength="3000" required aria-required="true"></textarea></label>
        <!-- A honeypot: hidden from people and screen readers; bots that fill every field fill it. -->
        <div class="fb-hp" aria-hidden="true"><label><span data-text="feedback.honeypot"></span> <input type="text" id="fb-hp" tabindex="-1" autocomplete="off"></label></div>
        <label class="row toggle"><span data-text="feedback.includeDetails"></span><input type="checkbox" id="fb-details-on" role="switch" checked></label>
        <details class="fb-details-box"><summary data-text="feedback.whatsIncluded"></summary><pre id="fb-details"></pre></details>
        <button type="button" class="big-btn fb-send" id="fb-send" data-text="feedback.send" disabled></button>
        <p class="help fb-status" id="fb-status" role="status" aria-live="polite"></p>
        <p class="help fb-note"><span data-text="feedback.privacyNote"></span> <a href="https://hoai2k.github.io/mini/musicpractice/privacy.html#feedback" target="_blank" rel="noopener" data-text="feedback.privacyLink"></a></p>
      </form>
    </dialog>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="gear" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  </svg>
  <script type="module" src="src/main.js"></script>
</body>
</html>
