<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17130f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Half-Blood Quests</title>
<meta name="description" content="Half-Blood Quests: a co-op action dungeon crawler for demigods. Train at Camp Half-Blood, see through the Mist, and fulfil the prophecy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "three-classic": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.24/build/index.module.js",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/build/index.module.js"
  },
  "scopes": {
    "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.24/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/examples/jsm/": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r186/examples/jsm/" },
    "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r186/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" },
    "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" },
    "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js" }
  }
}
</script>
  <!-- Visit counting (GoatCounter: no cookies, no identifiers), read by games.hoai.net/stats/. -->
  <script>window.goatcounter = { path: function () { return location.pathname; } };</script>
  <script data-goatcounter="https://hoai.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div id="app"></div>
<div id="dmg-layer" aria-hidden="true"></div>
<div id="hud" class="hidden"></div>
<div id="readout" class="hidden"></div>
<div id="toast-layer" aria-live="polite"></div>
<div id="touch" class="hidden"></div>
<div id="screens"></div>
<div id="loading">
  <div class="load-inner">
    <h1 class="title-type small" aria-label="Half-Blood Quests" data-t-aria-label="page.gameName"><span class="l1" aria-hidden="true" data-t="page.nameLine1">HALF-BLOOD</span><span class="key"></span><span class="l2" aria-hidden="true" data-t="page.nameLine2">QUESTS</span></h1>
    <div class="load-bar" role="progressbar" aria-label="Loading" data-t-aria-label="page.loadingBar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="load-fill"></div></div>
    <div id="load-text" data-t="page.loadingText">Loading the game…</div>
  </div>
</div>
<script>
// Loading screen, before the game's modules run (js/main.js takes over the
// bar once they have): the title shows once its font has loaded (never a
// fallback font first), and the bar follows the scripts as they arrive.
(function () {
  var el = document.getElementById('loading'), fill = document.getElementById('load-fill');
  var show = function () { el.classList.add('fonts'); };
  try { Promise.all([document.fonts.load('900 46px "Cinzel Decorative"'), document.fonts.load('700 16px "Cinzel"')]).then(show, show); } catch (e) { show(); }
  setTimeout(show, 2500);
  var n = 0;
  window.__bootP = 0;
  try {
    new PerformanceObserver(function (list) {
      for (var e of list.getEntries()) if (/\.m?js(\?|$)/.test(e.name)) n++;
      var p = 0.3 * (1 - Math.exp(-n / 45));
      if (p > window.__bootP && !window.__bootTaken) { window.__bootP = p; fill.style.width = (p * 100).toFixed(1) + '%'; }
    }).observe({ type: 'resource', buffered: true });
  } catch (e) { /* no observer: the bar starts with the game */ }
})();
</script>
<noscript><p class="noscript">Half-Blood Quests needs JavaScript and a WebGPU or WebGL2 capable browser.</p></noscript>
<script type="module" src="./js/main.js"></script>
</body>
</html>
