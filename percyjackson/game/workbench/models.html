<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Half-Blood Quests · Character viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #b8bcc4; font: 14px system-ui, sans-serif; color: #17130f; }
  #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; background: rgba(244,234,213,.92); z-index: 2; }
  button { font: inherit; padding: 6px 10px; border: 1px solid #6a5530; border-radius: 6px; background: #fff8e8; cursor: pointer; }
  button[aria-pressed=true] { background: #c9963a; color: #fff; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "three-classic": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.24/build/index.module.js",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/build/index.module.js"
  },
  "scopes": {
    "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.24/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/examples/jsm/": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r186/examples/jsm/" },
    "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r186/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" },
    "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" },
    "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js" }
  }
}
</script>

</head>
<body>
<div id="bar" role="toolbar" aria-label="Characters"></div>
<script type="module">
// A turntable of every character model, to compare with the 3D sheets in
// design/concept/vox-*.png. ?only=percy shows one; ?turn=0 stops turning.
import * as THREE from 'three/webgpu';
import { buildHeroModel, buildNpc, HERO_LOOKS } from '../js/entities/models.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
await renderer.init();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb8bcc4);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8070, 1.6));
const sun = new THREE.DirectionalLight(0xfff2dc, 2.4); sun.position.set(4, 8, 6); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshStandardNodeMaterial({ color: 0xa8acb4 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);
const ids = [...Object.keys(HERO_LOOKS), 'chiron', 'mr_d'];
let shown = q.get('only') ? [q.get('only')] : ids, rigs = [];
const turn = q.get('turn') !== '0';
function show(list) {
  for (const r of rigs) scene.remove(r.root);
  rigs = list.map((id, i) => {
    const r = HERO_LOOKS[id] ? buildHeroModel(id) : buildNpc(id);
    r.root.position.set((i - (list.length - 1) / 2) * 2.2, 0, 0); r.root.rotation.y = 0.45; scene.add(r.root); return r;
  });
  const w = list.length * 2.2;
  camera.position.set(0, 2.4, Math.max(5.5, w * 1.5)); camera.lookAt(0, 1.3, 0);
}
const bar = document.getElementById('bar');
for (const id of ['all', ...ids]) {
  const b = document.createElement('button'); b.textContent = id; b.setAttribute('aria-pressed', String(id === 'all' ? shown.length > 1 : shown[0] === id));
  b.onclick = () => { shown = id === 'all' ? ids : [id]; for (const x of bar.children) x.setAttribute('aria-pressed', String(x === b)); show(shown); };
  bar.appendChild(b);
}
show(shown);
window.__rigs = () => rigs;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const r of rigs) { if (turn) r.root.rotation.y += dt * 0.5; r.animate({ dt, speed: 0, vel: new THREE.Vector3() }); }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
