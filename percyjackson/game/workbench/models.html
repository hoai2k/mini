<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Half-Blood Quests · Character viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #b8bcc4; font: 14px system-ui, sans-serif; color: #17130f; }
  #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; background: rgba(244,234,213,.92); z-index: 2; }
  button { font: inherit; padding: 6px 10px; border: 1px solid #6a5530; border-radius: 6px; background: #fff8e8; cursor: pointer; }
  button[aria-pressed=true] { background: #c9963a; color: #fff; }
  canvas { display: block; }
  @media (pointer: coarse) { button { min-height: 40px; padding: 6px 12px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "three-classic": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.24/build/index.module.js",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/build/index.module.js"
  },
  "scopes": {
    "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.24/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "three/examples/jsm/": "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r186/examples/jsm/" },
    "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r186/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" },
    "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" },
    "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js" }
  }
}
</script>

</head>
<body>
<div id="bar" role="toolbar" aria-label="Characters"></div>
<script type="module">
// A turntable of every character model, to compare with the 3D sheets in
// design/concept/vox-*.png. ?set=heroes|monsters|mortals|bosses|people picks a row
// (default heroes); ?only=<id> shows one; ?turn=0 stops turning; ?yaw=<rad>
// sets the start angle; ?pose=attack|raise|cast|walk shows a pose; ?ui=0 hides
// the buttons; ?zoom=<k> moves the camera in or out; ?cam=high looks down;
// ?with=percy stands a hero beside them for scale.
import * as THREE from 'three/webgpu';
import { buildHeroModel, buildNpc, HERO_LOOKS } from '../js/entities/models.js';
import { buildMonsterModel, MONSTERS, MONSTER_IDS } from '../js/entities/monsters.js';
import { buildMortal, MORTAL_IDS } from '../js/entities/mortals.js';
import { BOSS_DEFS, BOSS_IDS } from '../js/entities/bosses.js';
import { buildPerson, PEOPLE_IDS } from '../js/entities/people.js';
import { rigOffsets } from '../js/entities/parts.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
await renderer.init();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb8bcc4);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8070, 1.6));
const sun = new THREE.DirectionalLight(0xfff2dc, 2.4); sun.position.set(4, 8, 6); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 60), new THREE.MeshStandardNodeMaterial({ color: 0xa8acb4 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 400);
const SETS = {
  heroes: { ids: [...Object.keys(HERO_LOOKS), 'chiron', 'mr_d'], build: (id) => (HERO_LOOKS[id] ? buildHeroModel(id) : buildNpc(id)) },
  monsters: { ids: MONSTER_IDS, build: (id) => buildMonsterModel(MONSTERS[id].model) },
  mortals: { ids: MORTAL_IDS, build: (id) => buildMortal(id) },
  bosses: { ids: BOSS_IDS, build: (id) => BOSS_DEFS[id].build() },
  people: { ids: PEOPLE_IDS, build: (id) => buildPerson(id) },
};
let set = SETS[q.get('set')] ? q.get('set') : 'heroes';
let shown = q.get('only') ? q.get('only').split(',') : SETS[set].ids, rigs = [];
const turn = q.get('turn') !== '0';
const yaw = q.has('yaw') ? +q.get('yaw') : 0.45;
const pose = q.get('pose');
function show(list) {
  for (const r of rigs) scene.remove(r.root);
  let x = 0; const widths = [];
  const withHero = q.get('with');
  rigs = [...(withHero ? [withHero] : []), ...list].map((id, i) => {
    const r = withHero && i === 0 ? SETS.heroes.build(id) : SETS[set].build(id); r.id = id;
    r.root.rotation.y = 0; r.root.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(r.root), s = b.getSize(new THREE.Vector3());
    r.w = Math.max(1.4, Math.max(s.x, s.z) * 0.9 + 0.5); r.h = s.y; widths.push(r.w);
    r.root.rotation.y = yaw; scene.add(r.root); return r;
  });
  const total = widths.reduce((a, b) => a + b, 0);
  for (const r of rigs) { r.root.position.set(x + r.w / 2 - total / 2, 0, 0); x += r.w; }
  frame.total = total; frame.h = Math.max(2, ...rigs.map((r) => r.h));
  frame();
}
// The camera fits the row in both directions, so a tall phone screen shows
// every model too (it used to fit the height and the row's length only).
function frame() {
  const { total = 4, h = 2 } = frame;
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), tanH = tanV * camera.aspect;
  const dist = Math.max(4, (total / 2) / tanH * 1.08, h * 2.4) * (+q.get('zoom') || 1);
  const high = q.get('cam') === 'high';
  camera.position.set(0, h * 0.6 + dist * (high ? 0.7 : 0.12), dist);
  controls.target.set(0, h * 0.42, 0); camera.lookAt(controls.target); controls.update();
}
// drag to turn round the row, pinch or scroll to zoom (mouse and touch)
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.screenSpacePanning = true;
renderer.domElement.style.touchAction = 'none';
const bar = document.getElementById('bar');
if (q.get('ui') === '0') bar.style.display = 'none';
function buttons() {
  bar.textContent = '';
  for (const s of Object.keys(SETS)) { const b = document.createElement('button'); b.textContent = s.toUpperCase(); b.setAttribute('aria-pressed', String(s === set)); b.onclick = () => { set = s; shown = SETS[s].ids; buttons(); show(shown); }; bar.appendChild(b); }
  for (const id of ['all', ...SETS[set].ids]) {
    const b = document.createElement('button'); b.textContent = id; b.setAttribute('aria-pressed', String(id === 'all' ? shown.length > 1 : shown.length === 1 && shown[0] === id));
    b.onclick = () => { shown = id === 'all' ? SETS[set].ids : [id]; buttons(); show(shown); };
    bar.appendChild(b);
  }
}
buttons();
show(shown);
window.__rigs = () => rigs;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); frame(); });
let last = performance.now(), T = 0;
const fake = { state: 'idle', swooping: false };
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const k = (T % 1.6) / 1.6;
  const action = pose === 'attack' ? { type: 'attack', t: k, style: 'swingR', windup: 0.3, strike: 0.5 } : pose === 'raise' ? { type: 'raise', t: 0 } : pose === 'cast' ? { type: 'cast', t: 1 } : null;
  for (const r of rigs) { if (turn) r.root.rotation.y += dt * 0.5; rigOffsets(r, -1); r.animate({ dt, speed: pose === 'walk' ? 1 : 0, vel: new THREE.Vector3(), action }); rigOffsets(r, 1); r.tick?.(dt, fake); }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
