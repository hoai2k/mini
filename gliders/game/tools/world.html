<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gliders · world viewer</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}#info{position:fixed;left:8px;top:6px;color:#fff;font:600 14px system-ui;text-shadow:0 1px 3px #000}</style>
</head>
<body>
<div id="info"></div>
<canvas id="c"></canvas>
<script type="module">
// Dev viewer: one frame of a world. ?level=<id> or ?seed=<text>
// &view=overview|launch|close  &low=1 (Low graphics). Sets window.done when drawn.
import * as THREE from '../vendor/three.module.min.js';
import { LEVELS, buildLevel, seededLevel } from '../src/levels.js';
import { createLevelScene } from '../src/scene.js';
const q = new URLSearchParams(location.search);
const def = q.get('seed') ? seededLevel(q.get('seed')) : LEVELS.find((l) => l.id === q.get('level')) || LEVELS[0];
const t0 = performance.now();
const level = buildLevel(def);
const t1 = performance.now();
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setSize(innerWidth, innerHeight, false);
const ls = createLevelScene(level);
ls.setDetail(q.get('low') === '1');
const cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.5, 12000);
const view = q.get('view') || 'overview';
const B = level.bounds;
if (view === 'launch') {
  const s = level.spawn.pos;
  cam.position.set(s[0], s[1] + 3, s[2]);
  cam.lookAt(0, B.top * 0.35, 0);
} else if (view === 'close') {
  // Beside the biggest island, looking along its flank.
  const part = level.parts.slice().sort((a, b) => b.radius - a.radius)[0];
  let x = part.cx + part.radius, y = part.cy, z = part.cz;
  for (let i = 0; i < 600 && level.world.nearest(x, y, z, 40) > 30; i++) x -= 3;
  cam.position.set(x + 10, y + 8, z + 120);
  cam.lookAt(x - 30, y, z - 60);
} else {
  cam.position.set(B.radius * 1.15, B.top * 0.9, B.radius * 0.7);
  cam.lookAt(0, B.top * 0.35, 0);
}
ls.update(10);
ls.prepareView(cam);
renderer.render(ls.scene, cam);
const counts = {};
document.getElementById('info').textContent = `${def.name} · ${JSON.stringify(def.materials)} · ${level.boxes.length} cubes · built in ${Math.round(t1 - t0)} ms`;
window.done = true;
</script>
</body>
</html>
