name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hopper/game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: hopper/game
      - run: pnpm typecheck && pnpm build:pages
        working-directory: hopper/game
      - run: pnpm install --frozen-lockfile && pnpm test
        working-directory: hopper/3d/standins
      - run: hopper/3d/publish.sh local/pages/hopper
      - run: sites/publish.sh local/pages/sites
      - uses: actions/upload-pages-artifact@v3
        with:
          path: local/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
