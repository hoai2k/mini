name: Deploy games to GitHub Pages

# Deploys from the `deploy` branch, not `main`: pushing to main runs nothing,
# and the site is published only when `deploy` is moved forward to main
# (`git push origin main:deploy`; see "Deploy state" in CLAUDE.md).
#
# A push to deploy builds and deploys only. Each game's build is its own step
# through .github/scripts/build-game.sh: a game that fails to build is
# published from its live copy instead (rebuilt from the live commit, or
# crawled off the site), with a warning and a line in the job summary, so one
# broken game never holds back the others. The shared root files must build,
# and the run fails if no game built at all.
#
# The tests (node --test, pnpm/npm test, the generators' --check runs, syntax
# checks) run only on demand:
# Actions -> Deploy games to GitHub Pages -> Run workflow -> tests: full.
# They write nothing the site is made from, so the published site is the same
# either way; a failing test stops that run's deploy. Run the checks of the
# games a change touches before committing (CLAUDE.md, "Tests and deploys").

on:
  push:
    branches: [deploy]
    # Skipped when a push changes only these: the Smoothcraft mod, Markdown,
    # and design, research, reference, intake, qa, tools and test folders,
    # the iOS/Android apps and the Workers, none of which the publish.sh
    # scripts or Hopper's build read. A push that also changes anything else
    # still deploys as usual.
    paths-ignore:
      - 'smoothcraft/**'
      - '**.md'
      - '.claude/**'
      - '*/design/**'
      - '*/intake/**'
      - '*/research/**'
      - '*/reference/**'
      - '*/qa/**'
      - '*/tools/**'
      - '*/app/test/**'
      - '*/game/test/**'
      - 'chat/test/**'
      - 'hopper/game/qa/**'
      - 'chat/ios/**'
      - 'musicpractice/mobile/**'
      - 'multiplayer/server/**'
      - 'stocks/server/**'
      - 'delete-merged-branches*.sh'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tests:
        description: Run the tests before deploying
        type: choice
        options: [none, full]
        default: none

permissions:
  contents: read

# Never cancel, deliberately. A deploy that is running always finishes, and
# GitHub keeps one pending run behind it, which a newer push replaces for
# free: during a burst of pushes the site publishes once per deploy length,
# and queued pushes collapse into the newest. Cancelling the running deploy
# on every push instead can starve the site: a steady stream
# of pushes would cancel every deploy before it finished. Per-game groups
# would not help either: there is one Pages site, and every run builds and
# publishes ALL games from the latest deploy, so a newer run already contains
# whatever a superseded one would have published. (Before October 2026 this
# was group github-pages, also never-cancel.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # a hung run otherwise bills up to 6 h
    permissions:
      contents: read
      # build-game.sh asks for the last successful run to rebuild a failed
      # game from the commit that is live.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A sparse checkout that leaves out the folders no build reads: the
      # big design/reference/research folders and smoothcraft/, about 3 GB of
      # the 5.6 GB tree. Measured on 1 November 2026 against the full checkout
      # on the same commit: checkout 77 s against 162 s, build job 104 s
      # against 185 s, and the published site identical (5,379 files, one
      # hash). An earlier try that left out only smoothcraft/ (~8 % of the
      # data) was slower than a full fetch; this one skips enough to win.
      # Hopper's build reads only three JSON files from hopper/3d/design and
      # hopper/3d/models (the 3D edition's code is bundled; its models,
      # textures and design files were never published), so the rest of those
      # folders, hopper/design and hopper/models stay out too: checkout 69 s,
      # same site hash.
      # A publish.sh that starts reading one of these folders must take it
      # off this list. The full test run reads the design folders (their
      # generators' --check), so it keeps the full checkout.
      - name: Checkout (full, for the full test run)
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        uses: actions/checkout@v4
      - name: Checkout (sparse)
        if: "!(github.event_name == 'workflow_dispatch' && inputs.tests == 'full')"
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/percyjackson/design/
            !/percyjackson/reference/
            !/smoothcraft/
            !/musicpractice/design/
            !/musicpractice/mobile/
            !/micro/design/
            !/micro/research/
            !/onemonster/reference/
            !/imageannotator/design/
            !/hopper/design/
            !/hopper/models/
            !/hopper/3d/textures/
            !/hopper/3d/design/*
            /hopper/3d/design/standin-manifest.json
            !/hopper/3d/models/*
            /hopper/3d/models/manifest.json
            /hopper/3d/models/collision.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hopper/game/pnpm-lock.yaml
      # The shared root files must build, or the whole deploy fails: every
      # game needs them.
      # The library page leaves out the card of every game deploy_config.json
      # switches off (.github/scripts/deploy-config.py).
      - name: Shared root files
        run: test -f multiplayer/client/mini-rooms.js && mkdir -p local/pages && cp favicon.ico local/pages/ && python3 .github/scripts/deploy-config.py library index.html local/pages/index.html
      - name: Build Hopper
        run: .github/scripts/build-game.sh hopper 'cd hopper/game && pnpm install --frozen-lockfile && pnpm build:pages'
      - name: Hopper tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: pnpm typecheck && pnpm test
        working-directory: hopper/game
      - name: Hopper 3D stand-in tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: pnpm install --frozen-lockfile && pnpm test
        working-directory: hopper/3d/standins
      - name: Build the sites
        run: .github/scripts/build-game.sh sites 'sites/publish.sh local/pages/sites'
      - name: Multiplayer relay tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: npm ci && npm test
        working-directory: multiplayer/server
        timeout-minutes: 5
      - name: Build Tank Wars
        run: .github/scripts/build-game.sh tankwars 'tankwars/publish.sh local/pages/tankwars'
      - name: Tank Wars tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --check tankwars/game/game.js && node --check tankwars/game/menu.js && node --check tankwars/game/sound.js
      - name: Build Games Chat
        run: .github/scripts/build-game.sh chat 'chat/publish.sh local/pages/chat'
      - name: Games Chat tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --test chat/test/*.test.mjs && python3 chat/design/source/build_requests.py --check
      - name: Build Gliders
        run: .github/scripts/build-game.sh gliders 'gliders/publish.sh local/pages/gliders'
      - name: Gliders tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --test test/*.test.mjs
        working-directory: gliders/game
      - name: Gliders generator checks
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: python3 gliders/design/source/build_requests.py --check && python3 gliders/design/source/build_audio.py --check
      - name: Build One Monster After Another
        run: .github/scripts/build-game.sh onemonster 'onemonster/publish.sh local/pages/onemonster'
      - name: One Monster After Another tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: python3 onemonster/design/source/build_requests.py --check
      - name: Build Ai-Ching
        run: .github/scripts/build-game.sh aiching 'aiching/publish.sh local/pages/aiching'
      - name: Ai-Ching tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --test aiching/app/test/*.test.mjs && python3 aiching/design/source/build_requests.py --check && python3 aiching/tools/build_web.py --check
      - name: Build Ear Trainer
        run: .github/scripts/build-game.sh eartrainer 'eartrainer/publish.sh local/pages/eartrainer'
      - name: Ear Trainer tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --test eartrainer/app/test/*.test.mjs && python3 eartrainer/design/source/build_requests.py --check
      - name: Build Music Practice
        run: .github/scripts/build-game.sh musicpractice 'musicpractice/publish.sh local/pages/musicpractice'
      - name: Music Practice tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --test musicpractice/app/test/*.test.mjs && python3 musicpractice/design/source/build_requests.py --check
      - name: Build Half-Blood Quests
        run: .github/scripts/build-game.sh percyjackson 'percyjackson/publish.sh local/pages/percyjackson'
      - name: Half-Blood Quests tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --test test/*.test.mjs
        working-directory: percyjackson/game
      - name: Half-Blood Quests generator checks
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: python3 percyjackson/design/source/build_requests.py --check && python3 percyjackson/design/source/build_cards.py --check && python3 percyjackson/design/source/build_hero_art.py --check && python3 percyjackson/design/source/build_concept_web.py --check
      - name: Build Bookzam
        run: .github/scripts/build-game.sh bookzam 'bookzam/publish.sh local/pages/bookzam'
      - name: Bookzam tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --test bookzam/app/test/*.test.mjs && node bookzam/tools/build-games.mjs --check
      - name: Build Stocks
        run: .github/scripts/build-game.sh stocks 'stocks/publish.sh local/pages/stocks'
      - name: Stocks tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --test stocks/app/test/*.test.mjs
      - name: Build MP3 Player
        run: .github/scripts/build-game.sh mp3player 'mp3player/publish.sh local/pages/mp3player'
      - name: MP3 Player tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --test mp3player/app/test/*.test.mjs && python3 mp3player/design/source/build_requests.py --check
      - name: Build Image Annotator
        run: .github/scripts/build-game.sh imageannotator 'imageannotator/publish.sh local/pages/imageannotator'
      - name: Image Annotator tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --test imageannotator/app/test/*.test.mjs && python3 imageannotator/design/source/build_requests.py --check
      - name: Build Meditation Timer
        run: .github/scripts/build-game.sh meditation 'meditation/publish.sh local/pages/meditation'
      - name: Meditation Timer tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: node --test meditation/app/test/*.test.mjs && python3 meditation/design/source/build_requests.py --check
      - name: Build Micro prototypes
        run: .github/scripts/build-game.sh micro 'micro/publish.sh local/pages/micro'
      - name: Micro prototypes tests
        if: github.event_name == 'workflow_dispatch' && inputs.tests == 'full'
        run: python3 micro/design/source/build_requests.py --check && python3 micro/design/source/build_audio.py --check && for f in $(find micro/prototypes micro/game micro/text_config.js -name '*.js' -not -path '*/vendor/*'); do node --check "$f" || exit 1; done
      - name: Fail only if no game built
        run: .github/scripts/check-games.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: local/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a hung run otherwise bills up to 6 h
    permissions:
      pages: write
      id-token: write
      # To delete the site artifact once it is live (see the last step).
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      # The uploaded site (over half a gigabyte) would otherwise sit in
      # Actions storage for a day after every push. Pages keeps its own copy,
      # so delete ours as soon as the deploy is done.
      - name: Delete the deployed site artifact
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false
