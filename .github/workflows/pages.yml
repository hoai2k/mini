name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hopper/game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: hopper/game
      - run: pnpm typecheck && pnpm build:pages
        working-directory: hopper/game
      - run: pnpm install --frozen-lockfile && pnpm test
        working-directory: hopper/3d/standins
      - run: sites/publish.sh local/pages/sites
      - run: for e in widowsbay partial; do for t in board act2 act3 act4 act5; do KOTF_EDITION=$e node kingdomofthefairies/qa/$t.test.mjs || exit 1; done; done && for t in animation sailor-motion theme assets-loader; do node kingdomofthefairies/qa/$t.test.mjs || exit 1; done && KOTF_EDITION=film node kingdomofthefairies/qa/film.test.mjs && python3 kingdomofthefairies/design/source/build_act_requests.py --check && python3 kingdomofthefairies/design/source/build_film_requests.py --check && python3 kingdomofthefairies/design/source/build_film_assets.py --check && kingdomofthefairies/publish.sh local/pages/kingdomofthefairies
      - run: node --test test/*.test.mjs && node scripts/check.mjs
        working-directory: bronzedrum/game
      - run: python3 bronzedrum/design/source/build_requests.py --check && python3 bronzedrum/design/source/build_audio.py --check && python3 bronzedrum/design/source/build_web_art.py --check && python3 bronzedrum/design/source/build_rigs.py --check
      - run: bronzedrum/publish.sh local/pages/bronzedrum
      - run: npm ci && npm test
        working-directory: multiplayer/server
        timeout-minutes: 5
      - run: node --check tankwars/game/game.js && node --check tankwars/game/menu.js && tankwars/publish.sh local/pages/tankwars
      - run: node --test chat/test/*.test.mjs && python3 chat/design/source/build_requests.py --check && chat/publish.sh local/pages/chat
      - run: node --test test/*.test.mjs
        working-directory: gliders/game
      - run: python3 gliders/design/source/build_requests.py --check && python3 gliders/design/source/build_audio.py --check && gliders/publish.sh local/pages/gliders
      - run: node --test test/*.test.mjs
        working-directory: icecreamcone/game
      - run: python3 icecreamcone/design/source/build_requests.py --check && icecreamcone/publish.sh local/pages/icecreamcone
      - run: python3 onemonster/design/source/build_requests.py --check && onemonster/publish.sh local/pages/onemonster
      - run: node --test test/*.test.mjs
        working-directory: fibreart/game
      - run: python3 fibreart/design/source/build_requests.py --check && fibreart/publish.sh local/pages/fibreart
      - run: node --test aiching/app/test/*.test.mjs && python3 aiching/design/source/build_requests.py --check && python3 aiching/tools/build_web.py --check && aiching/publish.sh local/pages/aiching
      - run: node --test eartrainer/app/test/*.test.mjs && python3 eartrainer/design/source/build_requests.py --check && eartrainer/publish.sh local/pages/eartrainer
      - run: node --test musicpractice/app/test/*.test.mjs && python3 musicpractice/design/source/build_requests.py --check && musicpractice/publish.sh local/pages/musicpractice
      - run: node --test test/*.test.mjs
        working-directory: percyjackson/game
      - run: python3 percyjackson/design/source/build_requests.py --check && python3 percyjackson/design/source/build_cards.py --check && python3 percyjackson/design/source/build_hero_art.py --check && python3 percyjackson/design/source/build_concept_web.py --check && percyjackson/publish.sh local/pages/percyjackson
      - run: cp index.html favicon.ico local/pages/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: local/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      # To delete the site artifact once it is live (see the last step).
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      # The uploaded site (over half a gigabyte) would otherwise sit in
      # Actions storage for a day after every push. Pages keeps its own copy,
      # so delete ours as soon as the deploy is done.
      - name: Delete the deployed site artifact
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false
