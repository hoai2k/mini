name: Deploy the mini-rooms relay

# Deploys multiplayer/server to Cloudflare when it changes on main. Needs the
# repository secrets CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare
# Workers" permission) and CLOUDFLARE_ACCOUNT_ID; without them the deploy
# step is skipped and the relay must be deployed by hand (npx wrangler deploy).
#
# The relay is the one deploy that still runs its tests on push: it is shared
# live infrastructure every online game talks to, so a logic bug here breaks
# them all at once, and the run only fires when the relay itself changes (a
# minute or two). A failing test stops the deploy. A manual run can skip them
# (tests: none) to redeploy in a hurry.

on:
  push:
    branches: [main]
    paths: ['multiplayer/server/**', '.github/workflows/relay.yml']
  workflow_dispatch:
    inputs:
      tests:
        description: Run the tests before deploying
        type: choice
        options: [full, none]
        default: full

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # a hung run otherwise bills up to 6 h
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: multiplayer/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Tests
        if: github.event_name != 'workflow_dispatch' || inputs.tests != 'none'
        run: npm test
        timeout-minutes: 5
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the relay was not deployed. Deploy it with 'npx wrangler deploy' in multiplayer/server."
